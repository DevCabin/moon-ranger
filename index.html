<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>MOON RANGER — Atari-style Jeep Scroller</title>
  <!-- Pixel-art moon in the browser tab. A plain SVG of 1x1 rects, so it
       stays crisp at any tab size and needs no PNG. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- The game renders entirely inside this canvas.
       The page is otherwise empty so the game fills the window. -->
  <canvas id="game"></canvas>
  <script src="game.js"></script>
</body>
</html>
